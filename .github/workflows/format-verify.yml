name: Format and verify

on:
  push:
    branches: [main]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.java"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - ".github/workflows/format-verify.yml"
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: format-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Apply repository formatting
        run: ./gradlew spotlessApply --console=plain --no-daemon
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "style: apply Spotless formatting"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Build and test
        run: ./gradlew clean build --console=plain --no-daemon
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Run Semgrep and print findings
        shell: bash
        run: |
          set +e
          semgrep scan --config .semgrep/rules.yml --json --output semgrep.json --error --exclude app/src/test --exclude "**/build/**" .
          scan_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("semgrep.json")
          if p.exists():
              data = json.loads(p.read_text())
              for finding in data.get("results", []):
                  loc = finding.get("start", {})
                  print(f"SEMGREP: {finding.get('check_id')} {finding.get('path')}:{loc.get('line')}:{loc.get('col')} — {finding.get('extra', {}).get('message', '')}")
              print(f"Semgrep findings: {len(data.get('results', []))}")
          PY
          semgrep scan --config .semgrep/rules.yml --sarif --output semgrep.sarif --exclude app/src/test --exclude "**/build/**" . || true
          exit "$scan_status"
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
