name: CI

on:
  push:
    branches: [main]
    paths: &code-paths
      - "**/*.kt"
      - "**/*.java"
      - "**/*.kts"
      - "**/*.gradle"
      - "**/*.xml"
      - "**/*.toml"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    branches: [main]
    paths: *code-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Test
        run: ./gradlew test --console=plain --no-daemon
      - name: Assemble FOSS debug APK
        run: ./gradlew :app:assembleUniversalFossDebug --console=plain --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: revenge-universal-foss-debug
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          if-no-files-found: error
