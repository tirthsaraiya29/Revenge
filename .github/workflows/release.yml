name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the APK to"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0"
      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Assemble FOSS release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_PASSWORD" ]; then
            printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          fi
          ./gradlew :app:assembleUniversalFossRelease --console=plain --no-daemon
      - name: Name and checksum artifacts
        run: |
          mkdir -p dist
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#v}"
          for apk in app/build/outputs/apk/universalFoss/release/*.apk; do
            cp "$apk" "dist/Revenge-${version}-universal-foss.apk"
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
