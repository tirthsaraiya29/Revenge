android.useAndroidX=true
android.newDsl=true
# Keep Gradle and the Kotlin compiler daemon within GitHub-hosted runner memory.
# Parallel variant compilation previously exhausted the runner heap in MusicService.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.caching=true
org.gradle.vfs.watch=true
kotlin.incremental=true
android.useFullClasspathForDexingTransform=true
android.suppressUnsupportedCompileSdk=37,37.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
